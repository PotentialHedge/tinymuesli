<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">tinyMuesli: an open jar of muesli</title>
  <defs>
    <path id="body" d="M30 48h68q6 0 6 6v42q0 22-22 22H46q-22 0-22-22V54q0-6 6-6z"/>
    <clipPath id="inside"><use href="#body"/></clipPath>
  </defs>
  <g stroke="#30271f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Lid, lifted off and tipped open -->
    <g transform="rotate(-14 64 20)">
      <rect x="26" y="12" width="78" height="14" rx="6" fill="#d7e6df"/>
      <path d="M35 18h40" fill="none" stroke="#fff" stroke-width="3"/>
    </g>
    <!-- Glass body and muesli -->
    <use href="#body" fill="#f5ead7" stroke="none"/>
    <g clip-path="url(#inside)" stroke-width="2.5">
      <path d="M20 66q11-7 22 0t22 0 22 0 22 0v60H20z" fill="#bd7040" stroke="none"/>
      <path d="m30 80 10-9 12 5-3 11-13 2zM58 72l12-2 8 9-8 9-13-4zM84 76l10-7 9 9-4 10-12 0zM36 101l11-8 11 6-3 12-14 1zM64 95l13-5 10 10-7 10-14-3z" fill="#e9b967" stroke="#70452c"/>
      <path d="m46 86 7-5 7 4-6 6zM77 87l7-5 6 5-7 5zM88 106l7-4 6 5-7 5z" fill="#f4d899" stroke="#70452c"/>
    </g>
    <use href="#body" fill="none"/>
    <!-- Glass highlight -->
    <path d="M32 58v10" fill="none" stroke="#fff" stroke-width="3.5"/>
    <!-- Thick glass rim -->
    <rect x="25" y="38" width="78" height="12" rx="5" fill="#d7e6df"/>
    <path d="M33 44h44" fill="none" stroke="#fff" stroke-width="3"/>
  </g>
</svg>
