<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <!-- Background of the installer DMG's window. tinyMuesli.app sits at (170, 180) and the
       Applications link at (470, 180); scripts/make-dmg.sh places them there. -->
  <rect width="640" height="400" fill="#fbf8f3"/>
  <text x="320" y="62" text-anchor="middle" fill="#24201b"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-size="22" font-weight="600" letter-spacing="-0.3">Drag tinyMuesli into Applications</text>
  <g fill="none" stroke="#b5562b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 180 H372"/>
    <path d="M354 162 L374 180 L354 198"/>
  </g>
  <text x="320" y="300" text-anchor="middle" fill="#6d655b"
        font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif"
        font-size="13">The first time, open it from System Settings › Privacy &amp; Security › Open Anyway.</text>
</svg>
